name: "Build and Deploy"
on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - .gitignore
      - README.md
      - LICENSE

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # submodules: true
          # If using the 'assets' git submodule from Chirpy Starter, uncomment above
          # (See: https://github.com/cotes2020/chirpy-starter/tree/main/assets)

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.4
          bundler-cache: true

      - name: Build site
        run: bundle exec jekyll b -d "_site${{ steps.pages.outputs.base_path }}" --incremental
        env:
          JEKYLL_ENV: "production"
          API_URL: ${{ secrets.API_URL }}

      # 공유 카드(og:image). 지난 실행에서 만든 카드를 캐시에서 받아 새 글이나 제목이 바뀐 글만 다시 만든다.
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Restore share cards
        uses: actions/cache@v6
        with:
          path: .og-cache
          key: og-cards-${{ github.run_id }}
          restore-keys: og-cards-

      # 저장소에서 npm install을 하면 devDependencies 전체가 함께 설치되므로
      # 임시 폴더에 package.json에 적힌 버전의 playwright만 설치하고 node_modules로 연결한다.
      # 브라우저는 내려받지 않고 러너에 설치된 Chrome을 쓴다(tools/og-cards.mjs의 대체 경로).
      - name: Install Playwright
        run: |
          version="$(node -p "require('./package.json').devDependencies.playwright")"
          npm install --prefix "$RUNNER_TEMP/playwright" --no-save --no-package-lock --no-audit --no-fund "playwright@$version"
          ln -s "$RUNNER_TEMP/playwright/node_modules" node_modules

      - name: Build share cards
        run: node tools/og-cards.mjs "_site${{ steps.pages.outputs.base_path }}"

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: "_site${{ steps.pages.outputs.base_path }}"

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
