---
layout: page
# The layout for Tag page
---

<div id="page-tag">
  <h1>
    {{ page.title }}
    <span class="taxonomy-count">({{ page.posts | size }})</span>
  </h1>
  <ul class="post-list">
    {% for post in page.posts %}
      {% include post-list-item.html post=post %}
    {% endfor %}
  </ul>
</div>
